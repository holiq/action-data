name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.9'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.9'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Select Testbench version
        run: composer require --no-update --no-interaction --dev orchestra/testbench:${{ matrix.testbench }}

      - name: Select Illuminate version
        run: >-
          composer require
          --no-update
          --no-interaction
          illuminate/support:${{ matrix.laravel }}
          illuminate/console:${{ matrix.laravel }}
          illuminate/filesystem:${{ matrix.laravel }}
          illuminate/container:${{ matrix.laravel }}
          illuminate/validation:${{ matrix.laravel }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: vendor/bin/pest
